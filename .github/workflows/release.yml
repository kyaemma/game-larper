name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1
          rustc --version
          cargo --version

      - name: Build release
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}".Trim()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' is not a valid version tag."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$env:GITHUB_SHA" -m "Game Larper $tag"
          git push origin "$tag"

      - name: Prepare release notes
        shell: pwsh
        run: |
          $zip = "artifacts\release\GameLarper-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "### LARPINNNGGG",
            "",
            "First public Windows build of Game Larper.",
            "",
            "Pick a game. Press play. Discord gets lied to.",
            "",
            "**Windows 10/11 x64**",
            "",
            "Extract the ZIP and keep GameLarper.exe and GameLarper.Runner.exe together.",
            "",
            "Discord's game detector is undocumented, so some titles may not work. The binaries are currently unsigned, so Windows may show an unknown-publisher / SmartScreen warning.",
            "",
            "**SHA-256**",
            $hash
          )
          $notes | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          gh release create "$tag" "artifacts\release\GameLarper-win-x64.zip#GameLarper-win-x64.zip" --repo "${{ github.repository }}" --title "Game Larper $tag" --notes-file release-notes.md --verify-tag
