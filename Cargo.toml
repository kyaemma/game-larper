[workspace]
resolver = "3"
members = [
    "crates/game-larper-core",
    "crates/game-larper-runner",
    "crates/game-larper",
    "xtask",
]
default-members = [
    "crates/game-larper-core",
    "crates/game-larper-runner",
    "crates/game-larper",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kyaemma/game-larper-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.59"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
